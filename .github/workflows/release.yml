name: Release

# Pushing a tag like v0.13.1 builds, tests and publishes the CLI from here, so
# the package on npm carries provenance: a signed link to this commit and run.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm:
    name: publish optimaizr to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # npm trades this run's identity for a publish token (trusted publishing),
      # so no npm token is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci

      - name: The tag is the version in apps/cli/package.json
        run: |
          VERSION="$(node -p "require('./apps/cli/package.json').version")"
          test "v$VERSION" = "$GITHUB_REF_NAME" \
            || (echo "::error::Tag $GITHUB_REF_NAME does not match optimaizr $VERSION." && exit 1)

      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        working-directory: apps/cli

  vsix:
    name: attach the VS Code extension
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
        working-directory: apps/vscode

      # The release may be there already, written by hand. Either way the
      # extension built from this tag ends up on it.
      - name: Upload the .vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
          gh release upload "$GITHUB_REF_NAME" apps/vscode/*.vsix --clobber
